# Cockpit Nav — Macなしで iOS アプリを作って TestFlight に送る設定
# 洗車OODA と同じ Codemagic のチーム設定（App Store Connect API キー：ASC_KEY）を使う
workflows:
  cockpit-ios:
    name: Cockpit Nav iOS (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: ASC_KEY
    environment:
      node: 22
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: jp.tanaka.cockpitnav   # capacitor.config.json の appId と同じ
    scripts:
      - name: Install
        script: npm install
      - name: Add iOS platform
        script: |
          if [ ! -d ios ]; then npx cap add ios; fi
      - name: App icon
        script: npx @capacitor/assets generate --ios --assetPath assets
      - name: Info.plist
        script: bash scripts/ios-plist.sh
      - name: Sync
        script: npx cap sync ios
      - name: Signing
        script: xcode-project use-profiles
      - name: Build number
        script: |
          cd ios/App && agvtool new-version -all $((PROJECT_BUILD_NUMBER + 1))
      - name: Build ipa
        script: |
          if [ -d ios/App/App.xcworkspace ]; then
            xcode-project build-ipa --workspace "ios/App/App.xcworkspace" --scheme "App"
          else
            xcode-project build-ipa --project "ios/App/App.xcodeproj" --scheme "App"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
